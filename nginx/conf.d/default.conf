server {
    listen 80;
    server_name augustusliu.top www.augustusliu.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name augustusliu.top www.augustusliu.top;

    ssl_certificate     /etc/letsencrypt/live/augustusliu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/augustusliu.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /api {
    return 308 /api/;
    }

    # Platform API endpoints (auth, users, etc.)
    location /api/ {
        proxy_pass http://platform:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block WordPress scanning attempts
    location ~ ^/(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc\.php|wp-config\.php) {
        access_log off;
        return 444;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

     location ~ /\.env {
        deny all;
        return 403;
    }
 
    location ~ /\.git {
        deny all;
        return 403;
    }
 
    location ~ /docker-compose\.yml {
        deny all;
        return 403;
    }
}
