# ============================================
# 后端编排
# 包含 AI Runtime 与 Go Platform
# 依赖 docker-compose.infra.yml 先创建共享网络和基础设施
# 启动方式: docker compose -f docker-compose.backend.yml up -d
# ============================================

name: ai-platform-backend

services:
  ai-runtime:
    build:
      context: .
      dockerfile: ./ai_runtime/Dockerfile
    container_name: ai-platform-runtime
    restart: always
    cpus: ${AI_RUNTIME_CPU_LIMIT:-1.5}
    mem_limit: ${AI_RUNTIME_MEMORY_LIMIT:-1536m}
    ports:
      - "8000:8000"
      - "50051:50051"
    env_file:
      - ./ai_runtime/.env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_platform
      - POSTGRES_USER=ai_platform
      - POSTGRES_PASSWORD=19980912
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - AGENT_TOOL_PROVIDERS=${AGENT_TOOL_PROVIDERS:-builtin,knowledge,mcp,project-context,workspace,sandbox-exec,web}
      - AGENT_PROJECT_CONTEXT_ENABLED=${AGENT_PROJECT_CONTEXT_ENABLED:-true}
      - AGENT_PROJECT_CONTEXT_TOOLS=${AGENT_PROJECT_CONTEXT_TOOLS:-project_list_context,project_search_context,project_read_context_item,project_list_uploaded_files,project_search_uploaded_files,project_read_uploaded_file}
      - AGENT_WORKSPACE_ENABLED=${AGENT_WORKSPACE_ENABLED:-false}
      - AGENT_WORKSPACE_ROOTS=${AGENT_WORKSPACE_ROOTS:-/tmp/ai-platform-workspaces}
      - AGENT_WORKSPACE_TOOLS=${AGENT_WORKSPACE_TOOLS:-workspace_list_files,workspace_read_file,workspace_search_text,workspace_file_info,workspace_tree,git_status,git_diff,git_show,git_log,git_branch}
      - AGENT_SANDBOX_EXEC_ENABLED=${AGENT_SANDBOX_EXEC_ENABLED:-false}
      - AGENT_SANDBOX_EXEC_TOOLS=${AGENT_SANDBOX_EXEC_TOOLS:-shell_exec,run_tests,run_lint,run_build}
      - AGENT_SANDBOX_RUNNER_CONFIGURED=${AGENT_SANDBOX_RUNNER_CONFIGURED:-false}
      - AGENT_SANDBOX_RUNNER_BACKEND=${AGENT_SANDBOX_RUNNER_BACKEND:-docker}
      - AGENT_SANDBOX_DOCKER_IMAGE=${AGENT_SANDBOX_DOCKER_IMAGE:-python:3.12-slim}
      - AGENT_SANDBOX_DOCKER_NETWORK=${AGENT_SANDBOX_DOCKER_NETWORK:-none}
      - AGENT_SANDBOX_DOCKER_MEMORY=${AGENT_SANDBOX_DOCKER_MEMORY:-1g}
      - AGENT_SANDBOX_DOCKER_CPUS=${AGENT_SANDBOX_DOCKER_CPUS:-1}
      - AGENT_SANDBOX_MAX_OUTPUT_CHARS=${AGENT_SANDBOX_MAX_OUTPUT_CHARS:-40000}
      - AGENT_SANDBOX_MAX_TIMEOUT_SECONDS=${AGENT_SANDBOX_MAX_TIMEOUT_SECONDS:-1200}
      - AGENT_WEB_ENABLED=${AGENT_WEB_ENABLED:-false}
      - AGENT_WEB_TOOLS=${AGENT_WEB_TOOLS:-fetch_url,open_page,extract_page_text,web_search}
      - AGENT_WEB_NETWORK_CONFIGURED=${AGENT_WEB_NETWORK_CONFIGURED:-false}
      - AGENT_WEB_ALLOWED_DOMAINS=${AGENT_WEB_ALLOWED_DOMAINS:-}
      - AGENT_WEB_DENIED_DOMAINS=${AGENT_WEB_DENIED_DOMAINS:-}
      - AGENT_WEB_MAX_RESPONSE_BYTES=${AGENT_WEB_MAX_RESPONSE_BYTES:-1000000}
      - AGENT_WEB_MAX_OUTPUT_CHARS=${AGENT_WEB_MAX_OUTPUT_CHARS:-40000}
      - AGENT_WEB_TIMEOUT_SECONDS=${AGENT_WEB_TIMEOUT_SECONDS:-20}
      - AGENT_WEB_SEARCH_ENDPOINT=${AGENT_WEB_SEARCH_ENDPOINT:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health").read(); print("ok")
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-platform

  platform:
    build:
      context: .
      dockerfile: ./platform/Dockerfile
    container_name: ai-platform-api
    restart: always
    cpus: ${PLATFORM_CPU_LIMIT:-1.0}
    mem_limit: ${PLATFORM_MEMORY_LIMIT:-512m}
    ports:
      - "8080:8080"
    depends_on:
      ai-runtime:
        condition: service_healthy
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - AI_RUNTIME_ADDR=ai-runtime:50051
      - AI_RUNTIME_HTTP_ADDR=http://ai-runtime:8000
      - PLATFORM_PORT=:8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_platform
      - POSTGRES_USER=ai_platform
      - POSTGRES_PASSWORD=19980912
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_REQUIRED=true
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - AI_RUNTIME_SKILLS_DIR=/home/appuser/ai_runtime/skills
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-platform

volumes:
  huggingface_cache:
    name: ai-platform_huggingface_cache
    driver: local

networks:
  ai-platform:
    external: true
    name: ai-platform_ai-platform
