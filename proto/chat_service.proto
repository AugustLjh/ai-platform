syntax = "proto3";

package ai.chat.v1;

option go_package = "github.com/ai-platform/proto/chat;chatpb";

// Chat service for AI interactions
service ChatService {
  // Stream chat with AI
  rpc StreamChat(ChatRequest) returns (stream ChatResponse);

  // Get chat history
  rpc GetChatHistory(ChatHistoryRequest) returns (ChatHistoryResponse);
}

// Chat request message
message ChatRequest {
  string session_id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string message = 4;
  map<string, string> metadata = 5;
  ChatConfig config = 6;
  repeated ContentPart content = 7;
}

message ContentPart {
  string type = 1;
  string text = 2;
  string url = 3;
  string base64 = 4;
  string mime_type = 5;
  string file_id = 6;
  string tool_call_id = 7;
  string data_json = 8;
  string file_name = 9;
}

// Chat configuration
message ChatConfig {
  string model = 1;
  float temperature = 2;
  int32 max_tokens = 3;
  bool use_rag = 4;
  repeated string tools = 6;
  reserved 5;
  reserved "use_agent";
}

// Chat response message (streaming)
message ChatResponse {
  string session_id = 1;
  string message_id = 2;
  ResponseType type = 3;
  string content = 4;
  TokenUsage token_usage = 5;
  string error = 6;
  map<string, string> metadata = 7;
}

enum ResponseType {
  RESPONSE_TYPE_UNSPECIFIED = 0;
  RESPONSE_TYPE_CONTENT = 1;
  RESPONSE_TYPE_THINKING = 2;
  RESPONSE_TYPE_TOOL_CALL = 3;
  RESPONSE_TYPE_COMPLETE = 4;
  RESPONSE_TYPE_ERROR = 5;
  RESPONSE_TYPE_RETRIEVAL = 6;
  RESPONSE_TYPE_ROUTE_DECISION = 7;
}

// Token usage tracking
message TokenUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  float cost = 4;
}

// Chat history request
message ChatHistoryRequest {
  string session_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

// Chat history response
message ChatHistoryResponse {
  repeated ChatMessage messages = 1;
  int32 total = 2;
}

// Chat message
message ChatMessage {
  string id = 1;
  string role = 2;
  string content = 3;
  int64 timestamp = 4;
  TokenUsage token_usage = 5;
  repeated ContentPart content_parts = 6;
}
