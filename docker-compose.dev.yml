version: '3.8'

# ============================================
# 开发环境配置 - 支持热重载和代码挂载
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================

services:
  # AI Runtime - 开发模式（挂载代码，支持热重载）
  ai-runtime:
    volumes:
      - ./ai_runtime:/app:rw                    # 挂载源码，支持实时修改
      - huggingface_cache:/root/.cache/huggingface  # 缓存模型，避免重复下载
      - /app/__pycache__                        # 排除 pycache
      - /app/.pytest_cache                      # 排除测试缓存
    command: >
      sh -c "
        pip install watchdog &&
        watchmedo auto-restart --directory=/app --pattern='*.py' --recursive --
        python -m main --mode both --http-port 8000 --grpc-port 50051
      "
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  # Platform - 开发模式（挂载代码，支持热重载）
  platform:
    volumes:
      - ./platform:/src/platform:rw             # 挂载源码
      - platform_build_cache:/go/pkg            # Go 构建缓存
    command: >
      sh -c "
        apk add --no-cache git make &&
        go install github.com/cosmtrek/air@latest &&
        air -c .air.toml
      "
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  # Frontend - 开发模式（挂载代码，Vite 热重载）
  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile.dev
      target: development
    volumes:
      - ./frontend-vue:/app:rw                  # 挂载源码
      - /app/node_modules                       # 排除 node_modules（使用容器内的）
      - /app/dist                               # 排除构建产物
    ports:
      - "5173:5173"                             # Vite 开发服务器端口
    command: npm run dev -- --host 0.0.0.0
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8080

  # Nginx - 开发模式（挂载配置，支持实时修改）
  nginx:
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro     # 挂载配置（只读）
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"

  # PostgreSQL - 开发模式（挂载初始化脚本）
  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro  # 挂载迁移脚本
    ports:
      - "5433:5432"                             # 暴露端口便于本地连接

  # Redis - 开发模式
  redis:
    ports:
      - "6379:6379"                             # 暴露端口便于本地连接

volumes:
  platform_build_cache:
    driver: local
  huggingface_cache:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
