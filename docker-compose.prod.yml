version: '3.8'

# ============================================
# 生产环境配置 - 完全容器化，不依赖宿主机
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

services:
  # AI Runtime - 生产模式（完全容器化）
  ai-runtime:
    restart: always
    # 不挂载源码，使用构建时复制的代码
    volumes:
      - huggingface_cache:/root/.cache/huggingface  # 仅保留模型缓存
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      - LOG_LEVEL=INFO
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health").read(); print("ok")
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Platform - 生产模式（完全容器化）
  platform:
    restart: always
    # 不挂载源码，使用构建时编译的二进制
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend - 生产模式（完全容器化）
  frontend:
    restart: always
    # 不挂载源码，使用构建时生成的静态文件
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Nginx - 生产模式（完全容器化）
  nginx:
    restart: always
    # 不挂载配置，使用构建时复制的配置
    volumes:
      - letsencrypt_data:/etc/letsencrypt:rw    # 仅保留 SSL 证书
      - certbot_webroot:/var/www/certbot:rw     # 仅保留 certbot 验证目录
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
      - LETSENCRYPT_STAGING=${LETSENCRYPT_STAGING:-0}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # PostgreSQL - 生产模式
  postgres:
    restart: always
    # 不暴露端口到宿主机，仅容器内访问
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data  # 仅保留数据卷
      # 不挂载迁移脚本，使用构建时复制的脚本
    environment:
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=1310kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Redis - 生产模式
  redis:
    restart: always
    ports: []  # 不暴露端口到宿主机
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Certbot - 生产模式
  certbot:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  huggingface_cache:
    driver: local
  letsencrypt_data:
    driver: local
  certbot_webroot:
    driver: local
