version: '3.8'

# ============================================
# 基础配置 - 所有环境共用
# 开发环境: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# 生产环境: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-platform-postgres
    environment:
      - POSTGRES_USER=ai_platform
      - POSTGRES_PASSWORD=19980912
      - POSTGRES_DB=ai_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-platform

  # Redis Cache
  redis:
    image: docker.1ms.run/library/redis:alpine
    container_name: ai-platform-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-platform

  # Elasticsearch
  elasticsearch:
    image: docker.1ms.run/library/elasticsearch:8.13.0
    container_name: ai-platform-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-platform

  # Python AI Runtime
  ai-runtime:
    build:
      context: .
      dockerfile: ./ai_runtime/Dockerfile
    container_name: ai-platform-runtime
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_platform
      - POSTGRES_USER=ai_platform
      - POSTGRES_PASSWORD=19980912
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    env_file:
      - ./ai_runtime/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - ai-platform
    profiles:
      - full

  # Go Platform Layer
  platform:
    build:
      context: .
      dockerfile: ./platform/Dockerfile
    container_name: ai-platform-api
    ports:
      - "8080:8080"
    environment:
      - AI_RUNTIME_ADDR=ai-runtime:50051
      - AI_RUNTIME_HTTP_ADDR=http://ai-runtime:8000
      - PLATFORM_PORT=:8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_platform
      - POSTGRES_USER=ai_platform
      - POSTGRES_PASSWORD=19980912
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ai-runtime:
        condition: service_started
    networks:
      - ai-platform
    profiles:
      - full

  # Vue Frontend
  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: ai-platform-frontend
    depends_on:
      - platform
    networks:
      - ai-platform
    profiles:
      - full

  # Nginx Gateway
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ai-platform-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - ai-platform
    depends_on:
      - frontend
      - platform
    profiles:
      - full

  # Certbot (Certificate Renewal)
  certbot:
    image: certbot/certbot:latest
    container_name: ai-platform-certbot
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - ai-platform
    depends_on:
      - nginx
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  huggingface_cache:
    driver: local
  letsencrypt_data:
    driver: local
  certbot_webroot:
    driver: local

networks:
  ai-platform:
    driver: bridge
