version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ai-platform-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=ai_platform
      - POSTGRES_PASSWORD=19980912
      - POSTGRES_DB=ai_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-platform

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-platform

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ai-platform-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-platform

  # Kibana (optional - for ES visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ai-platform-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ai-platform
    profiles:
      - observability

  # Python AI Runtime
  ai-runtime:
    build:
      context: ./ai_runtime
      dockerfile: Dockerfile
    container_name: ai-platform-runtime
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_platform
      - POSTGRES_USER=ai_platform
      - POSTGRES_PASSWORD=19980912
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      # Mount source code but preserve installed packages
      - ./ai_runtime:/app
      - ai_runtime_venv:/usr/local/lib/python3.11/site-packages
    command: python main.py --mode both --http-port 8000 --grpc-port 50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - ai-platform
    profiles:
      - full

  # Go Platform Layer
  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: ai-platform-api
    ports:
      - "8080:8080"
    environment:
      - AI_RUNTIME_ADDR=ai-runtime:50051
      - PLATFORM_PORT=:8080
      - LOG_LEVEL=INFO
      # Database connections
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_platform
      - POSTGRES_USER=ai_platform
      - POSTGRES_PASSWORD=19980912
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # JWT Secret
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ai-runtime:
        condition: service_started
    networks:
      - ai-platform
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  ai_runtime_venv:
    driver: local

networks:
  ai-platform:
    driver: bridge
